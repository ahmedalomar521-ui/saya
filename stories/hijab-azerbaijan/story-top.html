<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cairo';src:url('fonts/cairo-arabic-900-normal.woff2');font-weight:900}
@font-face{font-family:'Cairo';src:url('fonts/cairo-arabic-700-normal.woff2');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
.slide{position:relative;width:1080px;height:640px;overflow:hidden;font-family:'Cairo',sans-serif;
 background:transparent;}
.pattern{position:absolute;inset:0;opacity:.07}
.stars span{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.5}
.title{position:absolute;top:250px;left:0;right:0;text-align:center;color:#fff}
.title h1{font-weight:900;font-size:128px;line-height:1.1;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.title p{margin-top:18px;font-weight:700;font-size:58px;color:#FFE3B8;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.slot{position:absolute;left:260px;top:640px;width:560px;height:996px;border-radius:36px;
 background:rgba(0,0,0,.25);outline:4px solid rgba(255,255,255,.9);outline-offset:6px;
 box-shadow:0 0 40px rgba(255,227,184,.35),0 30px 70px rgba(0,0,0,.45)}
</style></head><body>
<div class="slide">
 <svg class="pattern" style="display:none" width="1080" height="1920"><defs><pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
  <g fill="none" stroke="#fff" stroke-width="2"><rect x="30" y="30" width="60" height="60"/><rect x="30" y="30" width="60" height="60" transform="rotate(45 60 60)"/><circle cx="60" cy="60" r="12"/></g></pattern></defs>
  <rect width="1080" height="1920" fill="url(#p)"/></svg>
 <div class="stars">
  <span style="left:120px;top:180px"></span><span style="left:940px;top:240px"></span><span style="left:860px;top:120px;opacity:.3"></span>
  <span style="left:200px;top:560px;opacity:.3"></span><span style="left:980px;top:600px"></span><span style="left:70px;top:900px;opacity:.35"></span>
 </div>
 <svg style="position:absolute;left:830px;top:150px" width="110" height="110" viewBox="0 0 100 100"><path d="M60 10a40 40 0 1 0 30 66A34 34 0 1 1 60 10z" fill="#FFE3B8" opacity=".9"/></svg>
 <div class="title"><h1>حجابكِ عزّكِ</h1><p>اثبتي… والأجر عند الله 🤍</p></div>
 
</div></body></html>
